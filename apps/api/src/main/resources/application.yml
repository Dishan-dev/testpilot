server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: testpilot-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/testpilot}
    username: ${DATABASE_USER:testpilot}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

testpilot:
  authorized-hosts: ${AUTHORIZED_HOSTS:}
  worker-token: ${WORKER_API_TOKEN:}
  artifact-secret: ${ARTIFACT_SECRET:}
  artifacts-dir: ${ARTIFACTS_DIR:../../artifacts}
  lease-seconds: ${LEASE_SECONDS:30}
  max-attempt-seconds: ${MAX_ATTEMPT_SECONDS:180}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
