spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/testpilot_test}
    username: ${TEST_DATABASE_USER:testpilot}
    password: ${TEST_DATABASE_PASSWORD:}
testpilot:
  authorized-hosts: fixture.test
  worker-token: test-worker-token-at-least-32-characters
  artifact-secret: test-artifact-secret-at-least-32-characters
  artifacts-dir: ${java.io.tmpdir}/testpilot-api-tests
  recovery-interval-ms: 3600000
